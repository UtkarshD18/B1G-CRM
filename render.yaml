# Temporary demo only: free Postgres expires after 30 days; files are ephemeral.
services:
  - type: web
    name: omnicrms-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: 'true'
      - key: HUSKY
        value: '0'
      - key: DATABASE_URL
        fromDatabase:
          name: omnicrms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CHANNEL_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://omnicrms.app
      - key: BACKEND_URL
        value: https://omnicrms-api.onrender.com
      - key: API_BASE_URL
        value: https://omnicrms-api.onrender.com/api
      - key: CORS_ORIGINS
        value: https://omnicrms.app,https://www.omnicrms.app,https://omnicrms-app.web.app,https://omnicrms-app.firebaseapp.com
databases:
  - name: omnicrms-db
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    ipAllowList: []
